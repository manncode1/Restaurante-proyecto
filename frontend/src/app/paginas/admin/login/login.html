<h1>Iniciar sesión</h1>

<form (submit)="entrar($event, usuario.value, password.value)">
  <p>
    <label for="usuario">Usuario</label><br />
    <input #usuario id="usuario" name="usuario" autocomplete="username" required />
  </p>
  <p>
    <label for="password">Contraseña</label><br />
    <input
      #password
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    />
  </p>

  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }

  <button type="submit" [disabled]="enviando()">Entrar</button>
</form>
